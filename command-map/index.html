<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR Walls Command Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    :root {
      --bg: #020408;
      --surface: rgba(0,255,240,0.04);
      --surface-hover: rgba(0,255,240,0.08);
      --border: rgba(0,255,240,0.12);
      --text: #e2f0ff;
      --text-dim: #4a6fa5;
      --accent: #00fff0;
      --accent2: #7b2fff;
      --glow: 0 0 20px rgba(0,255,240,0.3);
      --radius: 14px;
      --blur: blur(16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      height: 56px;
      background: rgba(2,4,8,0.97);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid rgba(0,255,240,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-label {
      font-size: 12px;
      color: var(--accent);
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,255,240,0.8);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-right: 16px;
    }

    select, input[type="text"] {
      background: var(--surface);
      border: 1px solid rgba(0,255,240,0.2);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select:hover, input[type="text"]:hover {
      background: var(--surface-hover);
      border-color: rgba(0,255,240,0.3);
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 8px rgba(0,255,240,0.15);
    }

    select option {
      background: #1a1a2e;
      color: #e2e8f0;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: rgba(0,255,240,0.1);
      box-shadow: 0 0 12px rgba(0,255,240,0.3);
    }

    button:active {
      transform: translateY(0);
    }

    #cy {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      background: #020408;
      background-image: linear-gradient(rgba(0,255,240,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,240,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .drawer {
      position: fixed;
      right: -400px;
      top: 0;
      width: 400px;
      height: 100vh;
      background: rgba(2,4,8,0.98);
      backdrop-filter: var(--blur);
      border-left: 1px solid rgba(0,255,240,0.15);
      overflow-y: auto;
      z-index: 1000;
      transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 20px;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .drawer-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0,255,240,0.5);
    }

    .drawer-close {
      background: transparent;
      border: 1px solid rgba(0,255,240,0.2);
      color: var(--text);
      width: 32px;
      height: 32px;
      padding: 0;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .drawer-close:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .drawer-section {
      margin-bottom: 20px;
    }

    .drawer-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 6px;
      margin-bottom: 8px;
    }

    .badge.status-done {
      background: rgba(0,255,150,0.15);
      color: #00ff96;
      border: 1px solid rgba(0,255,150,0.3);
    }

    .badge.status-in-progress {
      background: rgba(0,180,255,0.15);
      color: #00d2ff;
      border: 1px solid rgba(0,180,255,0.3);
    }

    .badge.status-blocked {
      background: rgba(255,34,68,0.15);
      color: #ff2244;
      border: 1px solid rgba(255,34,68,0.3);
    }

    .badge.status-next {
      background: rgba(255,140,0,0.15);
      color: #ff8c00;
      border: 1px solid rgba(255,140,0,0.3);
    }

    .badge.status-future {
      background: rgba(200,50,255,0.15);
      color: #c832ff;
      border: 1px solid rgba(200,50,255,0.3);
    }

    .badge.priority-critical {
      background: rgba(255,34,68,0.15);
      color: #ff2244;
      border: 1px solid rgba(255,34,68,0.3);
    }

    .badge.priority-high {
      background: rgba(255,140,0,0.15);
      color: #ff8c00;
      border: 1px solid rgba(255,140,0,0.3);
    }

    .badge.priority-medium {
      background: rgba(0,180,255,0.15);
      color: #00d2ff;
      border: 1px solid rgba(0,180,255,0.3);
    }

    .description {
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .details-table {
      width: 100%;
      font-size: 12px;
      border-collapse: collapse;
    }

    .details-table tr {
      border-bottom: 1px solid rgba(0,255,240,0.08);
    }

    .details-table td {
      padding: 10px 0;
      vertical-align: top;
    }

    .details-table td:first-child {
      color: var(--accent);
      opacity: 0.6;
      font-weight: 600;
      width: 100px;
      padding-right: 10px;
    }

    .next-action {
      background: rgba(0,255,240,0.05);
      border-left: 3px solid var(--accent);
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 16px;
    }

    .next-action-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Cytoscape node styling */
    .node {
      cursor: pointer;
    }

    .node:hover {
      opacity: 0.9;
    }

    .edge {
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }

    .edge.highlighted {
      opacity: 0.8;
    }

    /* Scrollbar styling */
    .drawer::-webkit-scrollbar {
      width: 8px;
    }

    .drawer::-webkit-scrollbar-track {
      background: transparent;
    }

    .drawer::-webkit-scrollbar-thumb {
      background: rgba(0,255,240,0.15);
      border-radius: 4px;
    }

    .drawer::-webkit-scrollbar-thumb:hover {
      background: rgba(0,255,240,0.25);
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ── Animations ─────────────────────────────── */
    @keyframes scanline {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    @keyframes glitch {
      0%,90%,100% { text-shadow: 0 0 20px rgba(0,255,240,0.8); clip-path: none; transform: none; }
      92%  { text-shadow: -2px 0 #ff003c, 2px 0 #00fff0; clip-path: inset(20% 0 60% 0); transform: translate(-2px,0); }
      94%  { text-shadow: 2px 0 #ff003c, -2px 0 #00fff0; clip-path: inset(50% 0 20% 0); transform: translate(2px,0); }
      96%  { text-shadow: 0 0 20px rgba(0,255,240,0.8); clip-path: none; transform: none; }
      98%  { text-shadow: -1px 0 #ff003c, 1px 0 #00fff0; clip-path: inset(5% 0 85% 0); transform: translate(-1px,0); }
    }
    @keyframes hud-pulse {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    @keyframes border-spin {
      0%   { border-color: rgba(0,255,240,0.3); box-shadow: 0 0 8px rgba(0,255,240,0.1); }
      50%  { border-color: rgba(0,255,240,0.7); box-shadow: 0 0 18px rgba(0,255,240,0.3); }
      100% { border-color: rgba(0,255,240,0.3); box-shadow: 0 0 8px rgba(0,255,240,0.1); }
    }
    @keyframes status-blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* Scanline overlay */
    #scanline-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to bottom, transparent, rgba(0,255,240,0.04) 50%, transparent);
      pointer-events: none;
      z-index: 9999;
      animation: scanline 6s linear infinite;
    }

    /* Vignette + noise on canvas */
    #cy::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }
    #cy { position: relative; }

    /* Logo glitch */
    .logo {
      animation: glitch 8s ease-in-out infinite;
      font-family: 'Orbitron', sans-serif !important;
    }

    /* HUD node count */
    .hud-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(0,255,240,0.6);
      border: 1px solid rgba(0,255,240,0.2);
      padding: 4px 10px;
      border-radius: 3px;
      letter-spacing: 1px;
      animation: border-spin 3s ease-in-out infinite;
    }

    /* Status bar */
    #status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: rgba(2,4,8,0.95);
      border-top: 1px solid rgba(0,255,240,0.1);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      z-index: 500;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: rgba(0,255,240,0.4);
    }
    #status-bar .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00ff96;
      display: inline-block;
      margin-right: 5px;
      animation: status-blink 2s ease-in-out infinite;
    }
    #status-bar .status-item { display: flex; align-items: center; }

    /* Legend */
    #legend {
      position: fixed;
      bottom: 32px;
      left: 16px;
      background: rgba(2,4,8,0.92);
      border: 1px solid rgba(0,255,240,0.15);
      border-radius: 8px;
      padding: 12px 14px;
      z-index: 600;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: rgba(0,255,240,0.5);
      min-width: 160px;
      transition: opacity 0.3s;
    }
    #legend.collapsed .legend-items { display: none; }
    #legend-title {
      color: rgba(0,255,240,0.8);
      letter-spacing: 1px;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    #legend.collapsed #legend-title { margin-bottom: 0; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: rgba(200,220,255,0.7);
    }
    .legend-swatch {
      width: 12px;
      height: 12px;
      border: 1.5px solid;
      flex-shrink: 0;
    }
    .legend-swatch.ellipse { border-radius: 50%; }
    .legend-swatch.diamond { transform: rotate(45deg); width: 10px; height: 10px; }
    .legend-swatch.hex { clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); border: none; }
    .legend-sep { border-top: 1px solid rgba(0,255,240,0.08); margin: 6px 0; }

    /* HUD corner brackets on drawer */
    .drawer::before,
    .drawer::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 2;
    }
    .drawer::before {
      top: 12px; left: 12px;
      border-top: 1px solid rgba(0,255,240,0.6);
      border-left: 1px solid rgba(0,255,240,0.6);
    }
    .drawer::after {
      bottom: 12px; right: 12px;
      border-bottom: 1px solid rgba(0,255,240,0.6);
      border-right: 1px solid rgba(0,255,240,0.6);
    }

    /* Toolbar: Orbitron for labels */
    .toolbar-label {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Make #cy height account for status bar */
    #cy { height: calc(100vh - 56px - 24px) !important; }

    /* Node hover tooltip hint */
    .node-tooltip {
      position: fixed;
      background: rgba(2,4,8,0.92);
      border: 1px solid rgba(0,255,240,0.25);
      color: rgba(0,255,240,0.8);
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 2000;
      display: none;
      letter-spacing: 0.5px;
    }

    @media (max-width: 1024px) {
      #toolbar {
        flex-wrap: wrap;
        height: auto;
        min-height: 56px;
        padding: 8px 12px;
      }

      .toolbar-group {
        font-size: 11px;
      }

      select, input[type="text"], button {
        font-size: 11px;
        padding: 5px 8px;
      }

      .drawer {
        width: 350px;
        right: -350px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="toolbar">
      <div class="logo">⬡ MR WALLS COMMAND MAP</div>
      <div class="hud-count" id="nodeCount">NODES: 0 / EDGES: 0</div>
      
      <div class="toolbar-group">
        <label class="toolbar-label">Layout</label>
        <select id="layoutSelect">
          <option value="radial">Radial</option>
          <option value="tree">Tree Branch</option>
          <option value="columns">Pillar Columns</option>
          <option value="workflow">Agent Workflow</option>
          <option value="force">Force Graph</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <input type="text" id="searchInput" placeholder="Search nodes..." style="width: 150px;">
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label">Pillar</label>
        <select id="filterPillar">
          <option value="">All</option>
          <option value="p-agents">Agents</option>
          <option value="p-workflows">Workflows</option>
          <option value="p-automations">Automations</option>
          <option value="p-systems">Systems</option>
          <option value="p-knowledge">Knowledge</option>
          <option value="p-roadmap">Roadmap</option>
          <option value="p-data">Data</option>
          <option value="p-samantha">Samantha</option>
          <option value="p-predictions">Predictions</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label">Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="done">Done</option>
          <option value="in-progress">In Progress</option>
          <option value="next">Next</option>
          <option value="future">Future</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label">Priority</label>
        <select id="filterPriority">
          <option value="">All</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <button id="exportJson">Export JSON</button>
      <button id="exportMarkdown">Export MD</button>
      <div class="toolbar-divider"></div>
      <button id="toggleNextSteps" style="background:transparent;border:1px solid rgba(255,220,0,0.5);color:rgba(255,220,0,0.8);letter-spacing:1px" title="Toggle recommended next steps layer">💡 NEXT STEPS</button>
    </div>

    <div id="scanline-overlay"></div>
    <div class="node-tooltip" id="nodeTooltip"></div>
    <div class="main-content">
      <div id="cy"></div>
      <div class="drawer" id="drawer">
        <div class="drawer-header">
          <div class="drawer-title" id="drawerTitle">Select a node</div>
          <button class="drawer-close" id="drawerClose">✕</button>
        </div>
        <div id="drawerContent"></div>
      </div>
    </div>
  </div>
  <div id="legend">
    <div id="legend-title">LEGEND <span id="legend-toggle">▼</span></div>
    <div class="legend-items">
      <div style="color:rgba(0,255,240,0.4);font-size:9px;margin-bottom:6px;letter-spacing:1px">NODE TYPES</div>
      <div class="legend-item"><div class="legend-swatch ellipse" style="background:rgba(123,47,255,0.18);border-color:#7b2fff"></div>Agent</div>
      <div class="legend-item"><div class="legend-swatch" style="border-radius:3px;background:rgba(0,210,255,0.12);border-color:#00d2ff"></div>Workflow</div>
      <div class="legend-item"><div class="legend-swatch diamond" style="background:rgba(255,140,0,0.15);border-color:#ff8c00"></div>Automation</div>
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,255,150,0.1);border-color:#00ff96"></div>System</div>
      <div class="legend-item"><div class="legend-swatch hex" style="background:#c832ff;width:12px;height:12px"></div>Roadmap</div>
      <div class="legend-item"><div class="legend-swatch" style="border-radius:3px;background:rgba(255,215,0,0.12);border-color:#ffd700"></div>Knowledge</div>
      <div class="legend-item"><div class="legend-swatch ellipse" style="background:rgba(0,255,150,0.12);border-color:#00ff96"></div>Prediction</div>
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,240,255,0.1);border-color:#00e5ff"></div>Data</div>
      <div class="legend-item"><div class="legend-swatch" style="border-radius:3px;background:rgba(255,50,150,0.15);border-color:#ff3296"></div>Workstream</div>
      <div class="legend-sep"></div>
      <div style="color:rgba(0,255,240,0.4);font-size:9px;margin-bottom:6px;letter-spacing:1px">STATUS</div>
      <div class="legend-item"><div style="width:12px;height:12px;border-radius:2px;background:rgba(0,255,150,0.3);border:1px solid #00ff96"></div>Done</div>
      <div class="legend-item"><div style="width:12px;height:12px;border-radius:2px;background:rgba(0,180,255,0.3);border:1px solid #00d2ff"></div>In Progress</div>
      <div class="legend-item"><div style="width:12px;height:12px;border-radius:2px;background:rgba(255,34,68,0.3);border:1px dashed #ff2244"></div>Blocked</div>
      <div class="legend-item"><div style="width:12px;height:12px;border-radius:2px;background:rgba(255,140,0,0.3);border:1px solid #ff8c00"></div>Next Up</div>
      <div class="legend-sep"></div>
      <div style="color:rgba(0,255,240,0.4);font-size:9px;letter-spacing:1px">LINES = connections</div>
    </div>
  </div>
  <div id="status-bar">
    <span class="status-item"><span class="status-dot"></span>SYSTEM ONLINE</span>
    <span class="status-item" id="sb-selected">SELECT NODE TO INSPECT</span>
    <span class="status-item" style="margin-left:auto">MR WALLS AI COMMAND MAP v2.0 // SANTA MONICA CA</span>
  </div>

  <script>
    let cy = null;
    let currentData = null;
    let allNodes = [];
    let allEdges = [];

    // Initialize Cytoscape

the main Jimi gateway. Less actively used. Dashboard at http://127.0.0.1:19789/","notes":"Separate from main Jimi gateway (port 18789). Originally set up to give Neo access to a second gateway. Token: mrwalls-neo-node-2026."},{"id":"w-nano-banana","label":"Nano Banana Render Pipeline","type":"workflow","pillar":"p-workflows","status":"done","priority":"high","description":"AI render workflow for project photos. Steps: (1) Get project photos from Google Photos album, (2) Vision filter — GPT-4o scores each photo for shot type (wide vs close-up) and quality (0.0–1.0), (3) Wide shots scoring ≥0.6 go through FAL AI Nano Banana model — renders each in 6 environment presets: hotel lobby, hospital, corporate, museum, spa, airport, (4) Upload rendered images to Dash DAM with metadata. Runs as Python script on Mac mini.","notes":"Channel: #dash-nanobanana. FAL model: Nano Banana (~/bin/zsh.15/image). 6 presets × N wide shots = batch of renders. GPT-4o vision filter is inconsistent — some manual curation in Dash still needed. Tested on Chartwell Edgewater (4 wide shots × 6 presets = 24 renders).","nextAction":"Refine vision filter consistency; monitor FAL credit levels"},{"id":"au-parcel-pickup","label":"FedEx Pickup Scheduling","type":"automation","pillar":"p-automations","status":"done","priority":"high","description":"After label print, Parcel schedules a FedEx pickup via schedule-pickup.sh script. Was broken for months (missing carrierCode: FDXG in API call) — fixed June 5, 2026. Pickup window: 2–6 PM. If scheduling fails, Parcel notifies user with fallback options (drop-off or call FedEx).","notes":"Script: workspace-parcel/scripts/schedule-pickup.sh. Fix: added carrierCode: FDXG to FedEx API payload. First successful pickup: CPU1465161561.","trigger":"After FedEx label creation in #parcel"},{"id":"w-parcel-copper","label":"Parcel → Copper CRM Logging","type":"workflow","pillar":"p-workflows","status":"in-progress","priority":"medium","description":"After each label print, Parcel looks up the recipient in Copper CRM by name/email. Found → updates address + logs ship note. Not found → creates new Person record with name, company, address, phone, email. Being wired in as of June 8-9, 2026 alongside existing Jimi's Addresses Airtable logging.","notes":"Copper API key: mario@marioromano.com. In addition to Airtable Jimi's Addresses table (not replacing). Will also backfill email addresses from Copper into existing Airtable records.","nextAction":"Complete wiring; test end-to-end with next shipment"},{"id":"s-qlcplus","label":"QLC+ / DMX Lighting","type":"system","pillar":"p-systems","status":"done","priority":"low","description":"DMX lighting control software (QLC+) used by Samantha for programmable lighting in studio/installations. Hardware: DiGiodot C4 Extended DMX controller. Used to configure and control fixture channels, groups, and scenes.","notes":"QLC+ runs on a separate machine (not Mac mini). DiGiodot C4 Extended firmware update: use Chrome/Firefox, wired connection same subnet. Jimi helped with fixture patching May 2026."},{"id":"au-pipeline-safety-net","label":"🛡️ Pipeline Safety Net","type":"automation","pillar":"p-automations","status":"done","priority":"critical","description":"Runs every 30 min during business hours (8am–6pm PT weekdays). Cross-references active backlit projects (RGB + White) in Airtable against live Flowspace inventory. Posts full inventory check to Discord #flowspace channel. Shows component demand vs. available + inbound stock with ✅/⚠️ alerts.","trigger":"Every 30 min 8am–6pm PT weekdays","output":"Discord #flowspace (1481693127055118447)","notes":"Excludes Fake Project and Dummy Project. Only checks Backlit = RGB or White projects. Posts even when all clear (safety net = always on). Fixed June 9 to exclude test projects."},{"id":"au-component-calculator","label":"⚙️ Backlit Component Calculator","type":"automation","pillar":"p-automations","status":"done","priority":"high","description":"Scans Airtable for backlit projects entering trigger phase (Production File). Calculates LED component quantities for each wall (aluminum channel, LED rolls, drivers, amplifiers, clear lens, wire, etc.). Writes calculated quantities back to the Walls per Project records in Airtable. Restricted to business hours (8am–6pm PT weekdays). Only runs on RGB + White backlit projects.","trigger":"Project phase transition → Production File","notes":"Writes to Walls per Project table in Airtable. Component types: 14 AWG Wire, AAA Batteries, Acrylic Stiffeners, Aluminum Channel (72\"), Amplifiers, Clear Lens (72\"), Driver (600W), Fuse Holders, Fuses, LED Rolls, Pigtail Plug, RGB Receiver, RGB Remote, RGB Wire Rolls, Wire Nuts."},{"id":"au-shortage-alert","label":"📧 Component Shortage Alert","type":"automation","pillar":"p-automations","status":"done","priority":"high","description":"Weekday mornings at 8am: emails Dania, Sawyer, and Carlo when any component is short or tight vs. pipeline demand. HTML email with color-coded table (red=SHORT, orange=TIGHT, green=OK). Includes Orderer and Order From columns from Flowspace Airtable table. Sent from ai@marioromano.com. Footer note: consult Carlo on project timelines before ordering.","trigger":"Cron 8am weekdays — only fires when there is a shortage","output":"Email to dania@marioromano.com, sawyer@marioromano.com, carlo@marioromano.com"},{"id":"d-flowspace-table","label":"Flowspace Component Table (Airtable)","type":"data","pillar":"p-data","status":"done","priority":"high","description":"Airtable table (in app6MNeWlLW997eVg) mirroring Flowspace inventory component info. 26 items with fields: Name, M|R Orderer, Source (where to order from), Value. Used by shortage alert emails to show who orders each component and how. Dania is the primary orderer for most items.","notes":"Not a live sync — reference table for orderer/source metadata. Live inventory levels come from Flowspace API directly."},{"id":"s-legacy","label":"Legacy (BOXX Node)","type":"system","pillar":"p-systems","status":"next","priority":"medium","description":"Second unassigned BOXX workstation. Serial B194275. Specs: Ryzen 9 5900X, 64GB DDR4, RTX A5000 24GB VRAM, Windows 10 Pro. Identical spec to Neo (B192087). Recommended for AI repurposing as second local compute node alongside Neo. Can run Qwen3-32B or Gemma 3 27B Q4_K_M locally via Ollama.","notes":"Nobody currently using it. Strongest local AI candidate after Neo. Setup requires: install OpenClaw, pair as node, install Ollama, load models.","nextAction":"Set up as second OpenClaw compute node with Ollama"},{"id":"k-athena-calcs","label":"Athena Calculators","type":"knowledge","pillar":"p-knowledge","status":"done","priority":"high","description":"Three built-in calculators in Athena's KNOWLEDGE.md: (1) Low Voltage Wire Formula — asks for amplifier groups (n) and LEDs per group (S), returns wire lengths and roll count. (2) Corian Adhesive Calculator — 2mL per foot of seam, 50mL per bottle; asks for feet of seam, returns mL + bottle count. (3) Wire Rolls Calculator — derived from same formula.","notes":"Wire formula reverse-engineered from Samantha's spreadsheet June 5 2026. Adhesive calculator added June 5 2026. Athena also speaks Spanish for design team (Emma, Lucia, Belen, Carlo)."},{"id":"r-ollama-local","label":"Local AI / Ollama on BOXX","type":"roadmap","pillar":"p-roadmap","status":"next","priority":"medium","description":"Planned: run local AI models via Ollama on unassigned BOXX workstations (Neo already set up as OpenClaw node, Legacy is next candidate). Would enable local inference without API costs. Recommended models for 24GB VRAM: Qwen3-32B Q4_K_M (~20GB) or Gemma 3 27B Q4_K_M (~16GB). Best machine: reeds (Lucia, RTX PRO 4500 32GB) could run 70B models.","notes":"Neo has Ollama installed but not yet actively used for production workloads. Local inference would be cost-free after setup. Discussed April 2026 in #studiocomputers."},{"id":"au-email-monitor","label":"Hourly Email Monitor","type":"automation","pillar":"p-automations","status":"done","priority":"high","description":"Runs every hour during business hours, monitors samantha@marioromano.com for actionable emails, posts summaries to Discord #samanthaemail. Filters out promos/automated alerts, only surfaces real items needing attention. Separate from the morning brief.","trigger":"Every hour during business hours","output":"Discord #samanthaemail (1480725204799066245)","notes":"Uses gog CLI + ai@marioromano.com. Stays silent when nothing actionable. Surfaces urgency levels: URGENT / Informational."},{"id":"au-dash-weekly","label":"Weekly Dash Auto-Upload","type":"automation","pillar":"p-automations","status":"done","priority":"high","description":"Every Friday: scans Airtable for projects in Internal or External Production phases with a Render Folder URL set. Automatically runs Google Photos to Dash pipeline for any not yet uploaded. Tracks state in dash-upload-state.json to avoid re-uploading.","trigger":"Every Friday (cron)","notes":"State file: dash-upload-state.json. Criteria: phase = Internal/External Production + Render Folder URL set + not already uploaded. 9+ projects processed as of May 2026. LaunchAgent configured. Key bugs fixed May 31: duplicate folder issue, Playwright scroll timeout, subfolder ID caching."},{"id":"au-goblin-client-reminders","label":"Goblin Client Reminders","type":"automation","pillar":"p-automations","status":"done","priority":"medium","description":"Early Goblin automation: two reminder cron jobs running at 9am weekdays — delivery-address-reminder and client-followup-reminder. Remind sales team about outstanding delivery addresses and pending client follow-ups. Were running before the New Project phase checker was added.","trigger":"9am weekdays","notes":"ackReaction: eyes (👀). Both confirmed running as of May 19 2026."}],"edges":[{"id":"root-p-agents","source":"root","target":"p-agents"},{"id":"root-p-workflows","source":"root","target":"p-wo     function initCytoscape() {
      // Load data (inline)
      currentData = INLINE_DATA;
      allNodes = currentData.nodes;
      allEdges = currentData.edges;

      const cytoData = allNodes.map(n => ({ data: n }))
        .concat(allEdges.map(e => ({ data: e })));

      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: cytoData,
        style: getCytoscapeStyle(),
        layout: { name: 'concentric', directed: true },
        wheelSensitivity: 0.1,
        pixelRatio: 'auto'
      });

      // Click handlers
      cy.on('tap', 'node', (evt) => {
        const node = evt.target;
        openDrawer(node.data());
        highlightConnected(node);
      });

      cy.on('tap', (evt) => {
        if (evt.target === cy) {
          closeDrawer();
          cy.elements().removeClass('highlighted');
        }
      });

      // Apply initial layout
      applyLayout('radial');
      cy.fit(cy.elements(), 40);

      // Update HUD count
      document.getElementById('nodeCount').textContent =
        'NODES: ' + allNodes.length + '  /  EDGES: ' + allEdges.length;

      // Hover glow effect
      const tooltip = document.getElementById('nodeTooltip');
      cy.on('mouseover', 'node', (evt) => {
        const n = evt.target;
        n.style({ 'shadow-blur': 35, 'shadow-color': '#00fff0', 'shadow-opacity': 0.9, 'shadow-offset-x': 0, 'shadow-offset-y': 0 });
        tooltip.textContent = n.data('type').toUpperCase() + ' // ' + n.data('label');
        tooltip.style.display = 'block';
      });
      cy.on('mouseout', 'node', (evt) => {
        const n = evt.target;
        // Reset shadow based on type
        const type = n.data('type');
        if (type === 'prediction') {
          n.style({ 'shadow-blur': 25, 'shadow-color': '#00ff96', 'shadow-opacity': 0.6 });
        } else if (n.data('status') === 'blocked') {
          n.style({ 'shadow-blur': 15, 'shadow-color': '#ff2244', 'shadow-opacity': 0.5 });
        } else {
          n.style({ 'shadow-blur': 0, 'shadow-opacity': 0 });
        }
        tooltip.style.display = 'none';
      });
      cy.on('mousemove', (evt) => {
        tooltip.style.left = (evt.originalEvent.clientX + 14) + 'px';
        tooltip.style.top  = (evt.originalEvent.clientY - 8) + 'px';
      });

      // ── Next Steps Layer ────────────────────────────────────
      let nextStepsVisible = false;

      function buildNextStepsLayer() {
        // Add recommendation nodes + edges for every node that has a nextAction
        const recElements = [];
        cy.nodes().forEach(node => {
          const d = node.data();
          if (!d.nextAction || d.type === 'recommendation') return;
          const recId = 'rec-' + d.id;
          if (cy.getElementById(recId).length > 0) return; // already exists
          recElements.push({
            group: 'nodes',
            data: {
              id: recId,
              label: '→ ' + d.nextAction,
              type: 'recommendation',
              parentNodeId: d.id
            }
          });
          recElements.push({
            group: 'edges',
            data: {
              id: 'rec-edge-' + d.id,
              source: d.id,
              target: recId,
              type: 'recommendation'
            }
          });
        });
        if (recElements.length > 0) cy.add(recElements);
      }

      function positionRecNodes() {
        cy.nodes('[type="recommendation"]').forEach(rec => {
          const parentId = rec.data('parentNodeId');
          const parent = cy.getElementById(parentId);
          if (!parent || parent.length === 0) return;
          const pos = parent.position();
          const h = parent.height() || 60;
          rec.position({ x: pos.x, y: pos.y + h / 2 + 35 });
        });
      }

      function toggleNextSteps() {
        nextStepsVisible = !nextStepsVisible;
        const btn = document.getElementById('toggleNextSteps');
        if (nextStepsVisible) {
          buildNextStepsLayer();
          positionRecNodes();
          cy.elements('[type="recommendation"]').addClass('rec-visible');
          btn.style.borderColor = 'rgba(255,220,0,0.9)';
          btn.style.color = '#ffe566';
          btn.style.background = 'rgba(255,220,0,0.12)';
          btn.style.boxShadow = '0 0 12px rgba(255,220,0,0.3)';
        } else {
          cy.elements('[type="recommendation"]').removeClass('rec-visible');
          btn.style.borderColor = 'rgba(255,220,0,0.5)';
          btn.style.color = 'rgba(255,220,0,0.8)';
          btn.style.background = 'transparent';
          btn.style.boxShadow = 'none';
        }
      }

      document.getElementById('toggleNextSteps').addEventListener('click', toggleNextSteps);

      // ── Update status bar on node click
      cy.on('tap', 'node', (evt) => {
        const d = evt.target.data();
        document.getElementById('sb-selected').textContent =
          '[' + (d.type||'').toUpperCase() + '] ' + d.label + ' // STATUS: ' + (d.status||'').toUpperCase();
      });
    }

        agent: { bg: 'rgba(123,47,255,0.15)', border: '#7b2fff' },
        workflow: { bg: 'rgba(0,210,255,0.10)', border: '#00d2ff' },
        automation: { bg: 'rgba(255,140,0,0.12)', border: '#ff8c00' },
        system: { bg: 'rgba(0,255,150,0.08)', border: '#00ff96' },

        data: { bg: 'rgba(0,240,255,0.08)', border: '#00e5ff' },

    function applyLayout(name) {
      let options = { directed: true, animate: true, animationDuration: 500 };

      switch(name) {
        case 'radial':
          cy.layout({ name: 'concentric', directed: true, animate: true, animationDuration: 500 }).run();
          break;
        case 'tree':
          cy.layout({ name: 'dagre', rankDir: 'TB', nodeSep: 60, rankSep: 80, animate: true, animationDuration: 500 }).run();
          break;
        case 'columns':
          cy.layout({ name: 'breadthfirst', directed: true, grid: true, spacingFactor: 1.4, animate: true, animationDuration: 500 }).run();
          break;
        case 'workflow':
          cy.layout({ name: 'dagre', rankDir: 'LR', nodeSep: 50, rankSep: 100, animate: true, animationDuration: 500 }).run();
          break;
        case 'force':
          cy.layout({ name: 'cose', animate: true, nodeRepulsion: 8000, idealEdgeLength: 120, animationDuration: 500 }).run();
          break;
      }
    }

      cy.elements().removeClass('highlighted');

      node.connectedEdges().addClass('highlighted');
      node.connectedEdges().target().addClass('highlighted');
      node.connectedEdges().source().addClass('highlighted');
    }

    function openDrawer(nodeData) {
      const drawer = document.getElementById('drawer');
      const title = document.getElementById('drawerTitle');
      const content = document.getElementById('drawerContent');

      title.textContent = nodeData.label;

      let html = '<div class="drawer-section">';
      
      if (nodeData.status) {
        html += `<div class="badge status-${nodeData.status}">${nodeData.status}</div>`;
      }
      if (nodeData.priority) {
        html += `<div class="badge priority-${nodeData.priority}">${nodeData.priority}</div>`;
      }

      html += '</div>';

      if (nodeData.description) {
        html += `<div class="drawer-section"><div class="description">${escapeHtml(nodeData.description)}</div></div>`;
      }

      if (nodeData.nextAction) {
        html += `<div class="drawer-section"><div class="next-action"><div class="next-action-label">Next Action</div>${escapeHtml(nodeData.nextAction)}</div></div>`;
      }

      const detailsFields = [
        { key: 'type', label: 'Type' },
        { key: 'pillar', label: 'Pillar' },
        { key: 'status', label: 'Status' },
        { key: 'priority', label: 'Priority' },
        { key: 'channel', label: 'Channel' },
        { key: 'file', label: 'File' },
        { key: 'owner', label: 'Owner' },
        { key: 'notes', label: 'Notes' }
      ];

      let hasDetails = false;
      let detailsHtml = '<table class="details-table">';

      detailsFields.forEach(field => {
        if (nodeData[field.key] && nodeData[field.key] !== nodeData.status && nodeData[field.key] !== nodeData.priority) {
          detailsHtml += `<tr><td>${field.label}</td><td>${escapeHtml(String(nodeData[field.key]))}</td></tr>`;
          hasDetails = true;
        }
      });

      detailsHtml += '</table>';

      if (hasDetails) {
        html += `<div class="drawer-section"><div class="drawer-section-title">Details</div>${detailsHtml}</div>`;
      }

      content.innerHTML = html;
      drawer.classList.add('open');
    }

    function closeDrawer() {
      const drawer = document.getElementById('drawer');
      drawer.classList.remove('open');
      cy.elements().removeClass('highlighted');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function applyFilters(searchQuery, pillarFilter, statusFilter, priorityFilter) {
      cy.elements().removeClass('hidden');

      cy.nodes().forEach(node => {
        const data = node.data();
        let hidden = false;

        if (searchQuery && !data.label.toLowerCase().includes(searchQuery) && 
            (!data.description || !data.description.toLowerCase().includes(searchQuery))) {
          hidden = true;
        }

        if (pillarFilter && data.pillar !== pillarFilter) {
          hidden = true;
        }

        if (statusFilter && data.status !== statusFilter) {
          hidden = true;
        }

        if (priorityFilter && data.priority !== priorityFilter) {
          hidden = true;
        }

        if (hidden) {
          node.addClass('hidden');
        }
      });

      cy.edges().forEach(edge => {
        const source = cy.$id(edge.data('source'));
        const target = cy.$id(edge.data('target'));
        if (source.hasClass('hidden') || target.hasClass('hidden')) {
          edge.addClass('hidden');
        }
      });
    }

      const dataStr = JSON.stringify(currentData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'command-map.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('exportMarkdown').addEventListener('click', () => {
      let md = '# MR Walls Command Map\n\n';

      const pillars = ['p-agents', 'p-workflows', 'p-automations', 'p-systems', 'p-knowledge', 'p-roadmap', 'p-data', 'p-samantha', 'p-predictions'];
      const pillarNames = {
        'p-agents': 'AI Agents',
        'p-workflows': 'Workflows',
        'p-automations': 'Automations',
        'p-systems': 'Internal Systems',
        'p-knowledge': 'Knowledge Base',
        'p-roadmap': 'Project Roadmap',
        'p-data': 'Data Infrastructure',
        'p-samantha': 'Samantha\'s Workstream',
        'p-predictions': 'Agentic Predictions'
      };

      pillars.forEach(pillar => {
        const nodes = allNodes.filter(n => n.pillar === pillar);
        if (nodes.length > 0) {
          md += `## ${pillarNames[pillar]}\n\n`;
          nodes.forEach(node => {
            if (node.type !== 'pillar') {
              md += `### ${node.label}\n`;
              if (node.description) md += `${node.description}\n\n`;
              if (node.status) md += `**Status:** ${node.status}\n`;
              if (node.priority) md += `**Priority:** ${node.priority}\n`;
              if (node.nextAction) md += `**Next Action:** ${node.nextAction}\n`;
              md += '\n';
            }
          });
        }
      });

      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'command-map.md';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Initialize on load
    // Legend toggle
    document.getElementById('legend-title').addEventListener('click', () => {
      const legend = document.getElementById('legend');
      const toggle = document.getElementById('legend-toggle');
      legend.classList.toggle('collapsed');
      toggle.textContent = legend.classList.contains('collapsed') ? '▶' : '▼';
    });

    window.addEventListener('load', () => {
      // Wait for web fonts before drawing so canvas picks them up
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(initCytoscape);
      } else {
        initCytoscape();
      }
    });
  </script>
</body>
</html>
